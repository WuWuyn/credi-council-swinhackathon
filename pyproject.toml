[project]
name = "creditlens"
version = "0.1.0"
description = "CreditLens AI — Credit Scoring & Creditworthiness Assessment for Underbanked & Micro SMEs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 120
target-version = ["py311"]
